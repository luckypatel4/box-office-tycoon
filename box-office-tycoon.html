.card{box-shadow:0 8px 24px -12px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06)}

.big{border-radius:12px;background:linear-gradient(180deg,#ffd97d,#eea23a);box-shadow:0 8px 22px -8px rgba(240,160,50,.7),inset 0 1px 0 rgba(255,255,255,.55)}

.badge{border-radius:8px}
.bar{height:7px}.bar i{background:linear-gradient(90deg,#eca13a,#f5c75b)}
nav{left:0!important;right:0!important;bottom:0!important;max-width:560px;border-radius:18px 18px 0 0!important;border:0!important;border-top:1px solid rgba(245,199,91,.2)!important;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))!important;background:rgba(5,11,26,.96)!important;box-shadow:0 -10px 30px -8px rgba(0,0,0,.8)!important}

nav .fab{flex:0 0 58px;height:50px;margin:0 6px;border-radius:14px;border:0;font-size:10px;gap:0;box-shadow:0 6px 18px -4px rgba(240,160,50,.7);animation:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px -4px rgba(240,160,50,.7)}
nav .fab svg{width:18px;height:18px}

.modal{background:rgba(2,6,16,.75)}

#splash h1{font-size:46px;letter-spacing:.04em;filter:drop-shadow(0 4px 0 #6b3d08) drop-shadow(0 8px 20px rgba(240,160,50,.45))}
#splash h1::after{content:"";display:block;width:140px;height:3px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--au),transparent)}
#splash .sm{margin-top:auto;margin-bottom:6vh;position:relative}
#splash .sm .ghost{background:rgba(8,18,45,.8);border:1px solid rgba(245,199,91,.3)}
#splash .tl{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;margin:0}
#splash .bl{display:none}#splash .sm .big{width:100%}#splash .sm{margin-bottom:9vh}

/* ===== Market wizard: one step at a time ===== */
#main[data-wz] > [data-st]{display:none}
#main[data-wz][data-cur="0"] > [data-st="0"],#main[data-wz][data-cur="1"] > [data-st="1"],#main[data-wz][data-cur="2"] > [data-st="2"],#main[data-wz][data-cur="3"] > [data-st="3"],#main[data-wz][data-cur="4"] > [data-st="4"]{display:block}
#main[data-wz] > .row[data-st]{display:none}
#main[data-wz][data-cur="0"] > .row[data-st="0"],#main[data-wz][data-cur="1"] > .row[data-st="1"],#main[data-wz][data-cur="2"] > .row[data-st="2"],#main[data-wz][data-cur="3"] > .row[data-st="3"],#main[data-wz][data-cur="4"] > .row[data-st="4"]{display:flex}
#main[data-wz] > h2[data-st]{display:none}
#main[data-wz][data-cur="0"] > h2[data-st="0"],#main[data-wz][data-cur="1"] > h2[data-st="1"],#main[data-wz][data-cur="2"] > h2[data-st="2"],#main[data-wz][data-cur="3"] > h2[data-st="3"],#main[data-wz][data-cur="4"] > h2[data-st="4"]{display:flex}
#main[data-wz] > .grid2[data-st]{display:none}
#main[data-wz][data-cur="0"] > .grid2[data-st="0"]{display:grid}
#main[data-wz] .row{gap:8px;padding:2px 2px 8px}
#main[data-wz] .chip{flex:0 0 140px;padding:9px 10px;font-size:12.5px;line-height:1.35;border-radius:12px}
#main[data-wz] .chip b{font-size:13px}#main[data-wz] .chip small{font-size:11px}
#main[data-wz] .pst.mini{width:46px;margin-bottom:5px}
#main[data-wz] h2,#main[data-wz] .ghost+h2{font:700 15px/1.2 -apple-system,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;margin:14px 2px 8px}
#main[data-wz] .ghost+h2::before{display:block}
#main[data-wz] .card{padding:12px;margin:8px 0}
#main[data-wz] .sl{padding:9px 11px;margin:6px 0}
#main[data-wz] .tile{padding:9px 11px}#main[data-wz] .tile span{font-size:17px}#main[data-wz] .tile b{font-size:15px}
#main[data-wz] .stp{margin:2px 0 6px}
#main[data-wz] .stp button.cur i{background:var(--au);color:#2a1500;border-color:var(--au);box-shadow:0 0 10px var(--gl)}
#main[data-wz] .stp button.cur small{color:var(--au)}
#main[data-wz] .stp button:first-child i{background:none;color:inherit;border-color:var(--bd)}
#main[data-wz] .stp button.cur:first-child i{background:var(--au);color:#2a1500;border-color:var(--au)}
#main[data-wz] .stp button.dn i{background:rgba(79,211,154,.18);border-color:var(--ok);color:var(--ok)}
#main[data-wz] .row .ghost{white-space:nowrap;padding:9px 13px;flex:none}
#main[data-wz] .sl span{font-size:13.5px;align-items:baseline}#main[data-wz] .sl span b{white-space:nowrap}
#main[data-wz] .sl .mu{font-size:11.5px;line-height:1.35}#main[data-wz] .sl input[type=range]{margin:6px 0 0;height:24px}
#main[data-wz] .card>.sl{margin:6px 0;background:rgba(0,0,0,.22)}
.wzn{display:flex;gap:10px;margin:14px 0 6px}.wzn .ghost{flex:0 0 90px;padding:13px 10px;border-radius:12px}.wzn .big{flex:1;padding:13px}

/* ===== Avatars, logos, posters ===== */
.av{display:inline-block;width:24px;height:24px;border-radius:50%;vertical-align:-7px;margin-right:7px;flex:none;box-shadow:0 0 0 1.5px rgba(245,199,91,.55);overflow:hidden}
.av svg{display:block;width:100%;height:100%}.av.lg{border-radius:12px}
.chip .av{display:block;width:42px;height:42px;margin:0 0 6px;border-radius:12px;box-shadow:0 0 0 1.5px rgba(245,199,91,.5)}
.top .av{width:34px;height:34px}.ol .nm .av{width:28px;height:28px}
.top>b{display:flex;align-items:center}.top .av{vertical-align:middle;margin-right:9px}.top .av{width:38px;height:38px}.ol .pst{width:40px;flex:none;border-radius:8px}

/* ===== Save system UI ===== */
.ht{display:flex;align-items:center;justify-content:space-between;gap:8px}
.svs{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid rgba(245,199,91,.4);color:var(--au);background:rgba(245,199,91,.1);cursor:pointer;white-space:nowrap}
.svs:empty{display:none}.svs.ok{color:var(--ok);border-color:rgba(79,211,154,.45);background:rgba(79,211,154,.1)}.svs.bad{color:#ffb3b0;border-color:var(--bad);background:rgba(255,107,102,.16)}
#sv{position:fixed;inset:0;z-index:80;display:none;overflow:auto;background:rgba(3,8,20,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
#sv.on{display:block}.svw{max-width:520px;margin:0 auto}
.svh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.svh h2{margin:6px 0}
.svx{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd2);color:var(--tx);font-size:18px;cursor:pointer}
.svw h3{margin:20px 2px 6px;font:700 13px -apple-system,Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.svw .big,.svw .ghost.wide{min-height:52px;margin:8px 0;font-size:16px}.svw .big.dng{background:linear-gradient(180deg,#ff8a84,#d9473b);color:#2a0705;box-shadow:none}
.svm{padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--mu);margin:8px 0}.svm.ok{color:var(--ok);border-color:rgba(79,211,154,.45)}.svm.bad{color:#ffb3b0;border-color:var(--bad);background:rgba(255,107,102,.12)}

const MATH_TXT=`Opening-day demand combines hype and marketing, star power (advance booking), film quality, release timing and rival films, so budget alone does not decide an opening. After release, word of mouth shapes the weekend jump, the weekday holds and how fast each week falls. Screens and seats cap how many tickets can be sold, and exhibitors add or cut screens by how full the halls are. Gross = tickets × your ticket price. Nett = gross minus GST (12% on tickets up to ₹100, 18% above). Exhibitors keep their cut, so the producer gets 56%, 49%, 43% and 36% of nett in weeks 1 to 4 and 36% after that (theatres keep the rest, and you can negotiate a better share in the Deals tab). A film plays at least 4 weeks. If reviews, word of mouth and box office hold up, it stays in theatres for up to 10 weeks. Each week theatres add or cut screens by the reviews and how full the halls are, times your theatre deal, minus 10% distributor commission. Profit = producer revenue + rights (OTT, satellite, music, overseas, brand tie-ups) − full cost sheet, minus any star profit share, then 25% income tax. Insurance pays half of crisis costs. Your production budget is split across sets, VFX, locations, crew and supporting cast, and each department feeds quality, hype, opening, overseas appeal or crisis risk. The censor certificate (U, U/A or A) changes your crowd. Festival weeks boost openings, more for matching genres. Unreleased films cost 0.4% finance interest per week. A calmer living world runs in the background (big news events happen only in 2 or 3 random months of a year, other months are normal): economy, season, news events, audience mood, star popularity and rival releases all move crowds, screens and deal prices. Rights are sold to named buyers who send bids, revise them every week with your buzz, reviews and box office, and let them expire. You can accept, counter, point to a rival bid or wait. Rights pay part upfront and the rest when the film opens. Box office is split across four territories (Mumbai and West, Delhi-UP and North, South, East and Bengal). Genre and your lead star's home region decide where the crowd comes from, ticket prices differ by territory, and screens follow demand only partly, so a hit in one region can sell out while another sits empty. Before and during release, controversies can hit: CBFC cuts, boycott calls, court cases that block a region, and exhibitor strikes. Real-world luck: box office is unpredictable. Small films (even ₹2 Cr) sometimes become sleeper hits as word of mouth builds week by week, and big-budget films sometimes flop when the audience rejects them, more so when hype runs far ahead of quality. Bank: savings earn 3.5% a year, fixed deposits 5.5 to 7.25%, loans are paid by monthly EMI at a rate set by your credit score, and a credit line costs 1.8% a month. Before you start a film you can take money from investors (two regular partners are always available, the others come and go every few weeks), so the producer need not fund everything alone. Investors fund part of a film; if it makes a profit they get their capital back, a premium and a share of the rest, and if it loses money they share the loss in proportion to what they put in; distributors give territory-wise minimum guarantees (40% on signing, 60% at release) and recoup them from that territory's theatre share before the overage comes to you minus a small distributor commission. Talent has careers: actors, directors and composers are real people whose ages stay fixed, newcomers grow towards a hidden potential, and film results move ratings. Hits raise a star's pull and flops lower it. Long-term contracts lock a discounted fee per film (+8% each film) and carry a penalty for unused films; hires can work for full fee, a lower fee plus profit share, or mostly profit share, depending on the person and the script. The shoot can run over budget once. Awards: each 48-week year ends with a ceremony. Nominees are the top 3 by score (critics, audience, genre taste, stars, campaign) against rival films with random jury luck, and wins raise fame, star pull and rights prices by up to 25% for 24 weeks. Language and market: Hindi, regional languages and Pan-India. A regional release pulls 65 to 70% of its crowd from its home territory and sells at 76 to 80% of the Hindi market, rising to about 100% for quality above 60. Pan-India costs 6% extra for dubbing and sells 90% to 125% of the market depending on hype times quality. Hollywood tentpoles open every 6 to 11 weeks; a clash cuts your weekly crowd by up to 25% of the clash score, and Hindi films suffer most, regional films about half. Leaderboard: studios are ranked by a Studio Power Index (30% net worth, 20% fame, 20% hit rate, 15% average ROI of the last 5 films, 15% award points that decay 15% a year), and 6 more rival studios compete with their own specialities and awards. A year is 12 months of 4 weeks. OTT streaming: films reach platforms 8 weeks after their theatre release, or next Friday if you premiere directly on OTT. Each platform has subscribers; a title's week-1 reach is 0.6% + 22% × appeal² of them, where appeal blends audience score, buzz, star pull, theatre performance and platform push. Views fade each week (slower for liked films), great word of mouth lifts week 2, and titles on one platform share a cap of 0.9 views per subscriber. OTT platforms are the same for both routes, but a direct premiere is sold as an exclusive first-run for a premium (at least 1.4× the normal bid, or cost-plus if higher), while a theatre release sells OTT rights after the run at the normal bid. A direct premiere cuts satellite, overseas and brand rights. Your OTT bonus is 8% (15% for direct premieres) of the value the platform earns above your fee at ₹40 per view, paid weekly after 25% tax. Money is stored as integer paise.`;

function newBuyer(c,k,used){const th=k=='th',pool=BN[k].filter(x=>!used.includes(x)),b={n:pool.length?pool[R(0,pool.length-1)]:BN[k][0]+' II',f:th?.97+Math.random()*.06:.88+Math.random()*.24,o:th?.93+Math.random()*.05:.64+Math.random()*.16,ex:S.week+R(2,4),r:0,age:0,dead:0,msg:'',fl:0,final:0,lv:0};if(k=='ott'&&S.ott&&S.ott.pl&&S.ott.pl[b.n])b.f*=.94+.12*S.ott.pl[b.n].s/42e6;b.b=bidOf(c,k,b);return b}
function bidList(c,k){c.bids=c.bids||{};if(!c.bids[k]){const n=k=='th'?R(2,3):R(2,4),L=[];for(let i=0;i<n;i++)L.push(newBuyer(c,k,L.map(x=>x.n)));c.bids[k]=L}return c.bids[k]}
function bidsTick(c,log){c.bids=c.bids||{};let any=0;for(const k of [...Object.keys(RT),'th']){if(k=='th'?c.th:c.rt[k]!=null)continue;const L=bidList(c,k);

if(L.filter(b=>!b.dead).length<(k=='th'?2:3)&&L.length<(k=='ott'?OTP.length:8)&&Math.random()<.4){L.push(newBuyer(c,k,L.map(x=>x.n)));any=1}}
if(any&&log)log.push(c.script.t+': new or revised bids came in. Check the Deals tab.')}
function autoTh(c){if(c.th)return;const t=((c.bids||{}).th||[]).filter(b=>!b.dead).reduce((m,b)=>Math.max(m,b.b),0);c.sm=t?Math.max(.8,t/100):.9;c.th=1;c.thn='Default chain deal'}

function dealSec(c){let h='<h2>Negotiation table</h2><small class="mu">Buyers send bids. Accept one, counter it, point to a rival bid, or wait. Bids change every week with your buzz, reviews and box office, and they expire. Selling early is safe but discounted; after release buyers price on box office. Rights pay part now and the rest when the film opens. Push too hard and a buyer walks.</small>';

if(th?c.th:c.rt[k]!=null){h+=th?kv('Theatre chains',(c.thn||'Signed')+' · '+Math.round(c.sm*100)+'% of standard share','pos'):kv(RT[k][0],'Sold to '+((c.rtn||{})[k]||'a buyer')+' for '+fmt(c.rt[k]),'pos');continue}
const L=bidList(c,k);
h+='<div class="card"><b>'+(th?'🎟 Theatre chains: producer share':IC[k]+' '+RT[k][0])+'</b>'+(th?kv('Standard share','100%')+kv('How they see your film','Buzz '+Math.round(hype(c))+' · Studio fame '+S.rep):kv('Trade estimate','about '+fmt(Math.round(fair(c,k))))+kv('Priced on',c.ph=='run'&&c.wk>0?'Box office so far':'Pre-release estimate (discounted)')+kv('Genre appeal',GF[k][c.script.g]>1.08?'High':GF[k][c.script.g]<.92?'Low':'Average')+kv('World factors','Economy '+pct(S.w.eco)+' · Star '+pct(S.w.sp[c.st])+' · Buyers '+pct(S.dm[k]*evM(k))));
let live=0;L.forEach((b,i)=>{if(b.dead)return;live++;const left=Math.max(0,b.ex-S.week+1),dv=th?Math.round(b.b+6):Math.round(b.b/CR*1.12*20)/20;
h+=`<div style="border-top:1px solid var(--bd);padding:8px 0 4px"><div class="top"><b>${b.n}</b><span class="badge">${left} wk${left==1?'':'s'} left</span></div>${kv('Their bid',th?b.b+'%':fmt(b.b),'pos')}<small class="mu">${th?(b.f>1.01?'Wants your film in more halls':'Steady partner'):(b.f>1.06?'Hungry for content':b.f<.94?'Cautious spender':'Steady buyer')}</small>${b.final?'<br><small class="neg">Final offer. Take it or leave it.</small>':''}${b.msg?'<br><small class="mu">'+b.msg+'</small>':''}<div class="row" style="margin-top:6px;align-items:center"><button class="ghost" onclick="accept('${k}',${i})">Accept</button><input type="number" id="cp_${k}_${i}" step="${th?1:.05}" min="1" value="${dv}" style="width:90px;margin:0"><button class="ghost" onclick="counter('${k}',${i})">Counter${th?' (%)':' (₹ Cr)'}</button>${L.filter(x=>!x.dead).length>1?`<button class="ghost" onclick="lev('${k}',${i})">Use rival bid</button>`:''}</div></div>`});
if(!live)h+='<small class="mu">No bids right now. New buyers may show up next week.</small>';

function sell(c,k,a,n){c.rt[k]=a;c.rtn=c.rtn||{};c.rtn[k]=n;const run=c.ph=='run',up=run?a:Math.round(a*ADV[k]);S.cash+=up;c.pend=(c.pend||0)+(a-up);c.note=RT[k][0]+' sold to '+n+' for '+fmt(a)+(run?'.':'. '+fmt(up)+' paid now, '+fmt(a-up)+' when the film opens.')}
function take(c,k,b,p,x){if(k=='th'){c.sm=Math.max(.8,(p||b.b)/100);c.th=1;c.thn=b.n;c.note='Theatre deal signed with '+b.n+' at '+Math.round(c.sm*100)+'% of the standard share.'}else sell(c,k,p||b.b,b.n);if(x)c.note+=x;(c.bids[k]||[]).forEach(y=>y.dead=1);save();deals()}

function counter(k,i){const c=S.proj[cu],b=c.bids[k][i],th=k=='th',v=parseFloat($('#cp_'+k+'_'+i).value);
if(!(v>0)){c.note='Enter your price first.';return deals()}
const ask=th?Math.round(v):cr(v),mx=mxOf(c,k,b),lim=th?mx:mx*.97;
if(ask<=b.b)return take(c,k,b);
if(b.final){b.dead=1;b.msg='Walked away: you pushed after their final offer.';c.note=b.n+' walked away.';save();return deals()}
if(ask>lim*(th?1.12:1.25)){b.dead=1;c.att[k]=(c.att[k]||0)+1;b.msg='Walked out: the ask was unrealistic.';c.note=b.n+' walked out. Word gets around and prices dip a little.';save();return deals()}
if(ask<=mx*(th?.97+.007*b.r:.9+.02*b.r))return take(c,k,b,ask,!th&&ask<mx*.8?' They said yes right away, so you probably asked too little.':'');
b.r++;b.b=Math.max(b.b,Math.round(Math.min(lim,b.b+(ask-b.b)*(th?.5:.55))));b.fl=b.b;
b.msg=b.r>=3?'Final offer. Take it or leave it.':'Came back with '+(th?b.b+'%':fmt(b.b))+'.';if(b.r>=3)b.final=1;
c.note=b.n+': '+b.msg;save();deals()}
function lev(k,i){const c=S.proj[cu],L=c.bids[k],b=L[i],th=k=='th';if(b.lv){b.msg='You already used that card with them.';c.note=b.msg;return deals()}b.lv=1;
const top=L.reduce((m,x,j)=>j!=i&&!x.dead?Math.max(m,x.b):m,0),mx=mxOf(c,k,b),lim=th?mx:mx*.97;
if(top<=b.b)b.msg='They know you have no better offer to show.';
else if(lim>=top){b.b=Math.max(b.b,Math.min(Math.round(lim),Math.round(top+(th?1:top*.01))));b.fl=b.b;b.msg='Matched the rival bid at '+(th?b.b+'%':fmt(b.b))+'.'}
else{b.b=Math.max(b.b,Math.round(lim));b.fl=b.b;b.msg='Cannot beat the rival bid. Stretched as far as they can, to '+(th?b.b+'%':fmt(b.b))+'.'}
c.note=b.n+': '+b.msg;save();deals()}
function runSec(c){const o=c.occ,tip=o>.9?'Houses are full: add screens or raise the price.':o<.5?'Many empty seats: cut screens or lower the price.':'Healthy occupancy.',rows=c.days.slice(-7).map(x=>`<tr><td>W${Math.floor(x.i/7)+1} ${DN[x.i%7]}</td><td>${x.t.toLocaleString('en-IN')}</td><td>${fmt(x.g)}</td><td>${fmt(x.p)}</td></tr>`).join('');

`<div class="sl"><span>Screens (100 to ${scrCap(c)}; theatres add or cut screens by reviews and how full the halls are) <b id="v1"></b></span><input type="range" min="100" max="${scrCap(c)}" step="100" value="${c.sn}" oninput="wset('sn',this.value)"></div><div class="sl"><span>Ticket price (₹100 to ₹500) <b id="v2"></b></span><input type="range" min="100" max="500" step="10" value="${c.pr}" oninput="wset('pr',this.value)"></div><div class="sl"><span>Promotion this week (₹ Cr, 0 to 10) <b id="v3"></b></span><input type="range" min="0" max="10" step="0.5" value="${c.pm}" oninput="wset('pm',this.value)"></div><button class="ghost wide" onclick="wopt()">⚡ Auto-optimize (max screens, ₹250)</button><div class="card" id="ws"></div>`+(c.wk?`<div class="card"><table><tr><th>Day</th><th>Tickets</th><th>Gross</th><th>Producer</th></tr>${rows}</table></div>`:'')}

function wkRet(c,j){const m=(womOf(c)+1)/2;let r=.16+.66*m;if(j>=2)r+=.1;if(j==1&&c.fm)r-=c.fm.c*.012;const gap=Math.max(0,((c.h||0)-(.6*(c.aud??55)+.4*(c.crit??55)))/100-.1);r-=.22*gap;r*=Math.pow(clamp(1+((c.leg||0)-(c.xr||0))/.9,.8,1.15),7);return clamp(r,.2,.93)}

const SAV_R=.035,CL_R=.018,FDS=[{m:3,r:.055},{m:6,r:.065},{m:12,r:.0725},{m:24,r:.07}],LTERMS=[6,12,24,36];

function ensureBank(){const B=S.bank=S.bank||{};B.sav=B.sav||0;B.fd=B.fd||[];B.loans=B.loans||[];B.cl=B.cl||{used:0};B.score=B.score||700;B.hist=B.hist||[];B.nid=B.nid||1}
const fdTotal=()=>S.bank.fd.reduce((a,f)=>a+f.amt,0),loanBal=()=>S.bank.loans.reduce((a,l)=>a+l.bal,0),bankDebt=()=>loanBal()+S.bank.cl.used,bankDeposits=()=>S.bank.sav+fdTotal(),worth=()=>S.cash+bankDeposits()-bankDebt();
const loanRate=()=>clamp(.12+(750-S.bank.score)*.0003,.105,.22);
const loanLimit=()=>S.bank.score<550?0:Math.round(cr(80)*clamp((S.bank.score-500)/300,0,1)*(.5+S.rep/100)+.5*bankDeposits()),loanAvail=()=>Math.max(0,loanLimit()-loanBal());
const clLimit=()=>S.bank.score<550?0:Math.round(cr(25)*clamp((S.bank.score-550)/250,0,1)*(.4+S.rep/100)),clAvail=()=>Math.max(0,clLimit()-S.bank.cl.used);
const emi=(P,r,n)=>Math.round(P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1));
function bkLog(t,a){const B=S.bank;B.hist.unshift({w:S.week,t,a});if(B.hist.length>40)B.hist.length=40}
const bkScore=d=>{S.bank.score=clamp(S.bank.score+d,300,900)};
const bankCan=a=>Math.max(0,S.cash)+S.bank.sav+clAvail()>=a;
function bankPay(a){let need=a;const t=Math.min(Math.max(0,S.cash),need);S.cash-=t;need-=t;if(need>0){const s=Math.min(S.bank.sav,need);S.bank.sav-=s;need-=s}if(need>0){const c=Math.min(clAvail(),need);S.bank.cl.used+=c;need-=c}return need}
function bankMonth(log){const B=S.bank;{const i=Math.round(B.sav*SAV_R/12);if(i>0){B.sav+=i;bkLog('Savings interest',i);log.push('🏦 Savings interest credited: '+fmt(i))}}
{const i=Math.round(B.cl.used*CL_R);if(i>0){B.cl.used+=i;bkLog('Credit line interest',i);log.push('🏦 Credit line interest added: '+fmt(i))}}
for(const l of B.loans.slice()){const m=1+(l.miss||0),due=l.emi*m+(l.late||0);if(bankCan(due)){bankPay(due);for(let k=0;k<m&&l.bal>0;k++){const it=Math.round(l.bal*l.r),pr=l.left<=1?l.bal:Math.min(l.bal,l.emi-it);l.bal-=pr;l.left--}l.miss=0;l.late=0;bkLog('EMI paid (loan #'+l.id+')',due);bkScore(2);if(l.left<=0||l.bal<=0){B.loans=B.loans.filter(x=>x!==l);bkScore(8);log.push('🏦 Loan #'+l.id+' fully repaid. Credit score up.')}else log.push('🏦 EMI paid: '+fmt(due))}else{l.miss=(l.miss||0)+1;l.late=(l.late||0)+Math.round(l.emi*.02);bkScore(-40);bkLog('EMI MISSED (loan #'+l.id+')',l.emi);log.push('⚠ EMI missed on loan #'+l.id+'. A late fee was added and your credit score fell.')}}
if(clLimit()>0&&B.cl.used/clLimit()>.8)bkScore(-5)}
function bankWeek(log){const B=S.bank;for(const f of B.fd.slice()){if(S.week>=f.mat){const i=Math.round(f.amt*f.r*f.m/12);B.sav+=f.amt+i;B.fd=B.fd.filter(x=>x!==f);bkLog('Fixed deposit matured',f.amt+i);log.push('🏦 Fixed deposit matured: '+fmt(f.amt)+' + '+fmt(i)+' interest, credited to savings.')}}
if(wi(S.week).k==1)bankMonth(log);

function ctrOffer(k,i){const t=TARR(k)[i],o=ctrOk(k,i);if(!o.ok)return alert(o.why);const now=k=='st'?sfee(i):t.fee;popup('<h2>'+t.n+': long-term deal</h2><small class="mu">Fee is locked per film (+8% each film). A signing bonus is paid now. Unused films at expiry cost 35% of the locked fee each.</small>'+[2,3,5].filter(n=>n==2||t.age<55).map(n=>{const f=Math.round(now*CD[n]*100)/100;return '<div style="border-top:1px solid var(--bd);margin-top:10px;padding-top:8px"><b>'+n+' films</b>'+kv('Fee per film',fmt(cr(f))+' (market '+fmt(cr(now))+')')+kv('Signing bonus',fmt(Math.round(cr(f*n)*.08)))+kv('Runs until',lbl(S.week+n*60))+'<button class="ghost" onclick="ctrSign(\''+k+'\','+i+','+n+')">Sign '+n+' films</button></div>'}).join('')+'<button class="big" style="margin-top:12px" onclick="closeM()">Not now</button>')}
function ctrSign(k,i,n){const o=ctrOk(k,i);if(!o.ok)return alert(o.why);const t=TARR(k)[i],now=k=='st'?sfee(i):t.fee,f=Math.round(now*CD[n]*100)/100,b=Math.round(cr(f*n)*.08);if(S.cash<b)return alert('Not enough cash for the signing bonus ('+fmt(b)+').');S.cash-=b;S.contracts.push({id:S.cnid++,k,i,films:n,used:0,fee0:f,exp:S.week+n*60,week:S.week});closeM();save();talentPage()}

function dealMax(k,i,sc){const t=TARR(k)[i];if(!t||t.gen||t.stock)return{m:2,why:''};const p=tpow(k,t),conf=sc.r+(t.g&&t.g==sc.g?10:0),tr=t.tr==null?.5:t.tr;let m=p>=85?(conf>=72?1:0):p>=50?(conf>=76?2:conf>=56?1:0):2;if(tr>.88)m=0;else if(tr<.2)m=Math.min(2,m+1);if(t.age>=45||(t.pk&&p<t.pk*.7))m=Math.min(2,m+1);if(ctrOf(k,i))m=Math.min(2,m+1);

<script>
/* ===== Soft generative background music (WebAudio, no files needed) ===== */
const BGM=(()=>{
const KEY='bot3:mus',BAR=8,M=n=>440*Math.pow(2,(n-69)/12);
let ctx=null,master=null,verb=null,echo=null,timer=0,nextT=0,bar=0,want=true,playing=false;
try{want=localStorage.getItem(KEY)!=='0'}catch(e){}
const PROG=[[48,55,59,64],[45,52,60,64],[41,48,57,64],[43,50,59,62]],PENT=[72,74,76,79,81,84];
function impulse(){const len=ctx.sampleRate*3.2,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return b}
function build(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();master=ctx.createGain();master.gain.value=0;
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.Q.value=.3;
verb=ctx.createConvolver();verb.buffer=impulse();const vg=ctx.createGain();vg.gain.value=.55;
echo=ctx.createDelay(1.5);echo.delayTime.value=.62;const fb=ctx.createGain();fb.gain.value=.32;echo.connect(fb);fb.connect(echo);const eg=ctx.createGain();eg.gain.value=.35;echo.connect(eg);
const dry=ctx.createGain();dry.gain.value=.8;
verb.connect(vg);vg.connect(lp);dry.connect(lp);eg.connect(lp);lp.connect(master);master.connect(ctx.destination);
ctx._in={dry,verb,echo};return true}
function tone(f,t,dur,vol,type,att,rel,tgt){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);tgt.forEach(x=>g.connect(x));o.start(t);o.stop(t+dur+.1)}
function sched(t){const ch=PROG[bar%PROG.length],I=ctx._in;
ch.forEach((n,i)=>{[-4,4].forEach(dt=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=M(n);o.detune.value=dt;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+2.4);g.gain.setValueAtTime(.045,t+BAR-2.6);g.gain.linearRampToValueAtTime(0,t+BAR+1.2);o.connect(g);g.connect(I.dry);g.connect(I.verb);o.start(t);o.stop(t+BAR+1.4)})});
tone(M(ch[0]-12),t,BAR,.1,'sine',1.6,2.4,[I.dry]);
let k=Math.floor(Math.random()*PENT.length);
for(let q=0;q<4;q++){if(Math.random()<.28)continue;k=Math.max(0,Math.min(PENT.length-1,k+Math.floor(Math.random()*5)-2));const tt=t+q*2+(Math.random()<.4?.5:0);tone(M(PENT[k]),tt,2.6,.05,'triangle',.02,2.4,[I.dry,I.verb,I.echo])}
bar++}
function pump(){if(!playing||!ctx)return;while(nextT<ctx.currentTime+3){sched(nextT);nextT+=BAR}}
function start(){if(!want||playing)return;if(!ctx&&!build())return;ctx.resume&&ctx.resume();playing=true;nextT=ctx.currentTime+.15;pump();clearInterval(timer);timer=setInterval(pump,1000);master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(.7,ctx.currentTime+3)}
function stop(){if(!ctx||!playing)return;playing=false;clearInterval(timer);master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.6);setTimeout(()=>{if(!playing&&ctx&&ctx.state=='running')ctx.suspend()},900)}
function paint(){document.querySelectorAll('.musb').forEach(b=>{b.classList.toggle('off',!want);b.setAttribute('aria-pressed',want)});try{if(S&&S.set)S.set.music=want?1:0}catch(e){}}
const api={get on(){return want},toggle(){want=!want;try{localStorage.setItem(KEY,want?'1':'0')}catch(e){}paint();want?start():stop()}};
const first=()=>{removeEventListener('pointerdown',first,true);removeEventListener('keydown',first,true);if(want)start()};
addEventListener('pointerdown',first,true);addEventListener('keydown',first,true);
document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden){if(playing)ctx.suspend()}else if(playing)ctx.resume()});
document.addEventListener('DOMContentLoaded',paint);paint();
return api})();
</script>
